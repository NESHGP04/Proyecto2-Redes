map $request_method $limite_post {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $limite_post zone=portal_post:10m rate=10r/m;

server {
    listen 80 default_server;
    server_name zenite.dernait.com _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://zenite.dernait.com$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name zenite.dernait.com;
    server_tokens off;
    client_max_body_size 8k;

    ssl_certificate /etc/letsencrypt/live/zenite.dernait.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zenite.dernait.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:zenite_tls:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location /static/ {
        alias /opt/zenite-portal/static/;
        expires 1h;
    }

    location / {
        limit_req zone=portal_post burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\. {
        deny all;
    }
}
