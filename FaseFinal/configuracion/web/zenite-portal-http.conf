# Zenite Prestige - portal publico en zp-web-01 (fase de pruebas por HTTP, antes del certificado).
# Se instala como /etc/nginx/sites-available/zenite-portal. En el checkpoint 4 se reemplaza por la
# version HTTPS (80 solo redirige a 443). Las directivas de nivel http se incluyen desde sites-enabled.
map $request_method $limite_post {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $limite_post zone=portal_post:10m rate=10r/m;

server {
    listen 80 default_server;
    server_name zenite.dernait.com _;
    server_tokens off;
    client_max_body_size 8k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    # Desafio HTTP-01 de Let's Encrypt (debe ir antes de la regla de archivos ocultos).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location /static/ {
        alias /opt/zenite-portal/static/;
        expires 1h;
    }

    location / {
        limit_req zone=portal_post burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\. {
        deny all;
    }
}
