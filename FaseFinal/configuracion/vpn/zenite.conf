# zenite.conf - servidor OpenVPN de Zenite Prestige en zp-vpn-01 (Fase final, Persona 3).
# Lo instala P3_vpn_servidor.sh en /etc/openvpn/server/ (servicio openvpn-server@zenite). Rutas absolutas: OpenVPN relee la CRL en cada conexion.
port 1194
proto udp
dev tun
topology subnet
server 10.30.0.0 255.255.255.224
# Split tunnel: solo la VPC va por la VPN; el perfil real (solo Intranet, nunca TI) lo aplica zenite-vpn-up.sh
push "route 10.20.0.0 255.255.255.0"

# PKI de easy-rsa: autenticacion solo por certificado, CRL para revocar y tls-crypt para cifrar el canal de control
ca /etc/openvpn/server/ca.crt
cert /etc/openvpn/server/zp-vpn-01.crt
key /etc/openvpn/server/zp-vpn-01.key
dh none
tls-crypt /etc/openvpn/server/tls-crypt.key
crl-verify /etc/openvpn/server/crl.pem
remote-cert-tls client
verify-client-cert require
tls-version-min 1.2
data-ciphers AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305

keepalive 10 120
max-clients 10
user nobody
group nogroup
persist-key
persist-tun
script-security 2
up /etc/openvpn/server/zenite-vpn-up.sh
verb 3
explicit-exit-notify 1
