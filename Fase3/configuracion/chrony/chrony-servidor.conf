# zp-ntp-01 (10.20.0.68) - Servidor NTP de Zenite Prestige
# Reemplaza /etc/chrony.conf. No incluye "sourcedir /run/chrony.d" a proposito:
# el DHCP le entrega a este servidor su propia IP como NTP y no debe sincronizarse consigo mismo.
# Fuente principal: Amazon Time Sync (no requiere NAT)
server 169.254.169.123 prefer iburst minpoll 4 maxpoll 4
# Fuente externa (requiere NAT encendido para ser alcanzable)
pool 2.amazon.pool.ntp.org iburst maxsources 2
# Solo la VPC puede consultar este servidor
allow 10.20.0.0/24
driftfile /var/lib/chrony/drift
makestep 1.0 3
rtcsync
logdir /var/log/chrony
log measurements statistics tracking
