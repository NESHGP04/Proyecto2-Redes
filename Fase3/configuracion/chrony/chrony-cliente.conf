# Clientes (Ventas, TI, Servidores) - sincronizan solo con el NTP interno
server 10.20.0.68 iburst
# Respaldo (activar solo despues de las pruebas, ver reporte):
# server 169.254.169.123 iburst minpoll 4 maxpoll 4
driftfile /var/lib/chrony/drift
