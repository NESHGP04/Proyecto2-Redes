# P4 - Configuración completa de /etc/nginx/nginx.conf para zp-intranet-01.
# Sustituye la configuración predeterminada únicamente en esta instancia.
# La instalación y nginx -t se realizan en el checkpoint 3, previa revisión.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 512;
}

http {
    types_hash_max_size 4096;
    types_hash_bucket_size 128;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 30;
    server_tokens off;

    log_format intranet '$remote_addr [$time_local] "$request" $status $body_bytes_sent';

    server {
        listen 80 default_server;
        server_name 10.20.0.71 zp-intranet-01 localhost;
        root /usr/share/nginx/zenite;
        index index.html;
        charset utf-8;
        autoindex off;

        access_log /var/log/nginx/zenite-access.log intranet;
        error_log /var/log/nginx/zenite-error.log warn;

        # Coincide la primera regla aplicable. No confiar en X-Forwarded-For.
        allow 127.0.0.1;
        allow 10.20.0.0/27;    # Ventas
        allow 10.20.0.96/28;   # TI
        allow 10.20.0.64/27;   # Servidores (incluye la propia instancia)
        deny all;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

        location / {
            try_files $uri $uri/ =404;
            limit_except GET {
                deny all;
            }
        }

        # Ningún archivo oculto debe publicarse.
        location ~ /\. {
            deny all;
        }
    }
}
